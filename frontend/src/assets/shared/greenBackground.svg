<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="fabricTexture">
<feTurbulence type="fractalNoise" baseFrequency="0.02 0.8" numOctaves="3" result="noise" />
<feDiffuseLighting in="noise" lighting-color="#303b2b" surfaceScale="1">
<feDistantLight azimuth="45" elevation="60" />
</feDiffuseLighting>
<feComposite operator="in" in2="SourceGraphic" />
</filter>
</defs>
<rect width="100%" height="100%" fill="#354a3a" filter="url(#fabricTexture)" />
</svg>